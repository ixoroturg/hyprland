dwindle {
	# Окна имеют размеры floating версии в тайлинге
	pseudotile = false

	# Новые окна появляются
	# 0 - в половине курсора
	# 1 - слева сверху
	# 2 - снизу справа
	force_split = 2

	# Не меняет направление сплита
	preserve_split = true

	# Сплитит в направление мыши (на 4 треугольниках)
	smart_split = false

	# Ресайзит относительно расположения окна, а не курсора внутри него
	smart_resizing = false

	permanent_direction_override = false

	split_width_multiplier = 1.0

	# Сплитит относительно окна, а не курсора
	use_active_for_splits = true
	
	default_split_ratio = 1

	split_bias = 0

	precise_mouse_move = true
	
}
