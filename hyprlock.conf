shape {
	size = 1920, 32
	valign = top
	halign = center
	xray = true
	zindex = 5
}


label {
	zindex = 1
	halign = left
	valign = center
	position = 400, 100

	font_size = 40


	text = Язык: $LAYOUT[en,ru,jp]
}
shape {

	border_size = 10
	border_color = rgba(0,200,255,1)

	rounding = -1
	
	zindex = 0
	halign = left
	valign = center
	position= 360,95
	size = 280,90
}

label {
	zindex = 1
	halign = center
	valign = top
	position = 0, -100

	font_size = 40

	text = $TIME
}
shape {
	border_size = 10
	border_color = rgba(255,0,0,1)

	rounding = -1

	zindex = 0
	valign = top
	halign = center

	position = 0, -85
	size = 200,90
}

input-field {
	monitor =
	size = 300, 50

	# hide_input = true

	check_text = Проверка ...

	fail_text = Неправильно, $ATTEMPTS / 5
	
	placeholder_text = Введите пароль
	position = 0, -120
	halign = center
	valign = center

}
