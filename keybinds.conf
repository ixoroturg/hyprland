$mainMod = SUPER

$terminal = kitty
$launcher = hyprlauncher
$filemanager = dolphin
$browser = thorium-browser-avx2

# 1920 / 20
$speedx = 96
$speedy = $speedx

$resizex = 100
$resizey = $resizex



bind = $mainMod, C, killactive
bind = $mainMod&Shift, C, forcekillactive

bind = $mainMod, T, exec, $terminal

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, A, workspace, -1
bind = $mainMod, D, workspace, +1

bind = $mainMod&SHIFT, 1, movetoworkspace, 1
bind = $mainMod&SHIFT, 2, movetoworkspace, 2
bind = $mainMod&SHIFT, 3, movetoworkspace, 3
bind = $mainMod&SHIFT, 4, movetoworkspace, 4
bind = $mainMod&SHIFT, 5, movetoworkspace, 5
bind = $mainMod&SHIFT, 6, movetoworkspace, 6
bind = $mainMod&SHIFT, 7, movetoworkspace, 7
bind = $mainMod&SHIFT, 8, movetoworkspace, 8
bind = $mainMod&SHIFT, 9, movetoworkspace, 9
bind = $mainMod&SHIFT, 0, movetoworkspace, 10

bind = $mainMod&Shift, D, movetoworkspace, special
bind = $mainMod&Shift, A, movetoworkspace, 3

bind = $mainMod, Z, exec, hyprctl keyword cursor:zoom_factor 3
bind = $mainMod$Shift, Z, exec, hyprctl keyword cursor:zoom_factor 1

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreenstate, 2 0 toggle

bind = $mainMod, L, lockactivegroup, toggle
bind = $mainMod, O, togglegroup

bind = $mainMod, J, changegroupactive, b
bind = $mainMod, K, changegroupactive, f

bind = $mainMod, S, togglespecialworkspace
bind = $mainMod, P, pin
bind = $mainMod, W, submap, window_management

bind = $mainMod, Q, layoutmsg, togglesplit
bind = $mainMod, E, layoutmsg, swapsplit

# bind = $mainMod, P, dpms, toggle
# bind = $mainMod, F, fullscreen, 2

bind = $mainMod, R, submap, application

submap = application, reset


bind = , T, exec, $terminal
bind = , G, exec, $browser
bind = , E, exec, $filemanager
bind = , F, exec, $launcher
bind = , S, exec, steam

submap = reset

submap = window_management

bind = , escape, submap, reset

bind = , P, pin
bind = , F, fullscreenstate, 2 0 toggle
bind = , V, togglefloating

bind = , left, movefocus, l
bind = ,right, movefocus, r
bind = ,up, movefocus, u
bind = , down, movefocus, d

bind = Shift, left, movewindoworgroup, l
bind = Shift,right, movewindoworgroup, r
bind = Shift,up, movewindoworgroup, u
bind = Shift, down, movewindoworgroup, d
bind = , C, centerwindow
bind = Shift, C, centerwindow

bind = , O, togglegroup

binde = Ctrl, left, resizeactive, -$resizex 0
binde = Ctrl, right, resizeactive, $resizex 0
binde = Ctrl, up, resizeactive, 0 $resizey
binde = Ctrl, down, resizeactive, 0 -$resizey


binde = Alt, left, moveactive, -$speedx 0
binde = Alt, right, moveactive, $speedx 0
binde = Alt, up, moveactive,  0 -$speedy
binde = Alt, down, moveactive, 0 $speedy

submap = reset


bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


bind = $mainMod, X, exec, hyprpicker
